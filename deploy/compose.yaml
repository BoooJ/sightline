# Déploiement serveur : copier ce fichier à côté du code (~/apps/sightline/compose.yaml).
# L'app n'écoute que sur 127.0.0.1 ; Caddy la publie en HTTPS. L'accès est protégé par les comptes de l'app (page Équipe).
name: sightline
services:
  sightline:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      # une seule analyse de démo à la fois (pic ~1,5 Go par analyse à 32 images/s, lecture par passes)
      SKYBOX_MAX_PARALLEL_IMPORTS: "1"
    volumes:
      - sightline-data:/app/data
    # 3 Go depuis le 30/10/2026 (accord de l'utilisateur) : marge pour la ré-analyse à 32 images/s ; le serveur a 3,8 Go
    # de RAM + 2 Go d'échange, les autres services en utilisent ~0,5 Go en réalité
    mem_limit: 3g
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  sightline-data:
