[project]
name = "skybox-cs"
version = "0.1.0"
description = "Analyse de démos CS2 : import, replay 2D, stats"
requires-python = ">=3.12"
dependencies = [
    "orjson>=3.10",
    "demoparser2==0.42.1",  # épinglé : props, mémoire et empreintes mesurées sur cette version
    "pandas>=2.2,<4",  # mesuré sous 3.1.0 (Nuke aussi sous 2.2.3)
    "pyarrow>=26,<27",  # épinglé : mémoire et durées de l'analyse mesurées sous 26.0.0 (l'image Docker résout tout à neuf)
    "numpy>=2.5,<2.6",  # épinglé : mesuré sous 2.5.4
    "msgpack>=1.0",
    "zstandard>=0.22",
    "fastapi>=0.115",
    "starlette>=1.5,<2",  # GZipMiddleware(exclude_content_types) de main.py : apparu en 1.5
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "tomli-w>=1.0",
    "anthropic>=1.0",
    "httpx>=0.27",
    "pywebpush>=2.0",  # notifications web de l'app mobile
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdemo: nécessite une vraie démo (SKYBOX_TEST_DEMO)"]

[tool.ruff]
line-length = 120
